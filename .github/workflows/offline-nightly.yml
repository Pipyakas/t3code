name: Offline nightly

# Publishes an unsigned Windows x64 nightly for every push to main. Upstream is
# merged, with conflicts resolved, by a scheduled agent on a local machine
# before it pushes; installed copies auto-update from these releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: offline-nightly
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  # Upstream's workflows target its own runners, secrets, and services.
  # Merges keep bringing them back, so disable everything but this file.
  disable_upstream_workflows:
    name: Disable upstream workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable upstream workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: .github/workflows/offline-nightly.yml
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq ".workflows[] | select(.state == \"active\" and .path != \"$SELF\") | .id" |
          while read -r id; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
          done

  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }

      - id: meta
        name: Resolve nightly version
        shell: bash
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output

      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_SIGNED: "false"
          T3CODE_DESKTOP_WSL_RUNTIME: ""
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          # T3's public client config; this fork uses T3 Connect only as a client.
          T3CODE_CLERK_PUBLISHABLE_KEY: "pk_live_Y2xlcmsudDMuY29kZXMk"
          T3CODE_CLERK_JWT_TEMPLATE: "t3-relay"
          T3CODE_RELAY_URL: "https://relay.t3.codes"
        run: |
          node scripts/update-release-package-versions.ts "${{ steps.meta.outputs.version }}"
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 \
            --build-version "${{ steps.meta.outputs.version }}" --verbose

      # SSH environments and `t3 service` install the server on a Windows host
      # from this archive, pinned to the desktop's own version.
      - name: Build CLI single-executable
        shell: bash
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build CLI archive
        shell: bash
        run: |
          set -euo pipefail
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/win32-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform win --arch x64 \
            --version "${{ steps.meta.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* \
            --expect-version "${{ steps.meta.outputs.version }}"
          cd release-cli
          sha256sum t3-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: |
            release/*.exe
            release/*.blockmap
            release/nightly.yml
            release-cli/*
          fail_on_unmatched_files: true
